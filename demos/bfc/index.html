<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFC — Burgers & Fried Chicken</title>
<meta name="description" content="BFC — Burgers & Fried Chicken. Burgers, poulet croustillant, sides. Sur place ou à emporter : commande par téléphone, à récupérer au magasin.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a08; --bg-2:#17110d; --card:#1e1712; --line:rgba(245,166,35,.18);
  --yellow:#f5a623; --yellow-2:#ffc94d; --red:#e0262b; --wine:#8c1d2a;
  --cream:#fff4e2; --muted:#b9a993;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--cream);font-family:Inter,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{width:min(1160px,100% - 32px);margin-inline:auto}
.h{font-family:"Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.marker{font-family:"Permanent Marker",cursive}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* bandeau démo */
.demo{background:var(--yellow);color:#1a1108;font-size:.8rem;text-align:center;padding:6px 16px;font-weight:600}

/* damier façon écrans menu */
.checker{height:14px;background:
  linear-gradient(90deg,var(--yellow) 50%,transparent 0) 0 0/28px 7px repeat-x,
  linear-gradient(90deg,transparent 50%,var(--yellow) 0) 0 7px/28px 7px repeat-x;opacity:.9}

/* nav */
header{position:sticky;top:0;z-index:50;background:rgba(13,10,8,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.logo b{font-family:"Permanent Marker",cursive;font-size:2rem;color:var(--yellow);font-weight:400;line-height:1}
.logo span{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.links{display:flex;gap:26px;list-style:none}
.links a{text-decoration:none;font-size:.92rem;font-weight:500;color:var(--muted);transition:color .2s}
.links a:hover{color:var(--yellow)}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:700 .74rem Inter;padding:7px 11px;cursor:pointer}
.lang button.on{background:var(--yellow);color:#1a1108}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.95rem;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.y{background:var(--yellow);color:#1a1108;box-shadow:0 10px 30px rgba(245,166,35,.28)}
.btn.y:hover{background:var(--yellow-2)}
.btn.o{border:1.5px solid rgba(255,244,226,.5);color:var(--cream)}
.btn.o:hover{border-color:var(--yellow);color:var(--yellow)}
.btn.sm{padding:9px 18px;font-size:.85rem}
.menu-btn{display:none;background:none;border:0;color:var(--cream);width:42px;height:42px;cursor:pointer}
.menu-btn svg{width:26px;height:26px}

/* hero */
.hero{position:relative;padding:70px 0 80px;overflow:hidden}
.hero::before{content:"";position:absolute;width:700px;height:700px;left:-200px;top:-200px;background:radial-gradient(circle,rgba(245,166,35,.16),transparent 65%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{margin:16px 0 6px}
.hero h1 .marker{display:block;font-size:clamp(5rem,14vw,9.5rem);color:var(--yellow);line-height:.9;text-shadow:0 0 30px rgba(245,166,35,.35)}
.hero h1 .h{display:block;font-size:clamp(1.5rem,3.6vw,2.4rem);margin-top:14px}
.hero h1 .h em{font-style:normal;color:var(--red)}
.hero p.sub{color:var(--muted);max-width:470px;margin:16px 0 28px;font-size:1.05rem}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.modes{display:flex;gap:18px;flex-wrap:wrap;margin-top:30px;font-size:.88rem;color:var(--muted)}
.modes span{display:flex;align-items:center;gap:7px}
.modes svg{color:var(--yellow)}
.hero-pics{position:relative;height:560px}
.hero-pics figure{position:absolute;overflow:hidden;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.hero-pics img{width:100%;height:100%;object-fit:cover}
.hero-pics .p1{inset:0 22% 0 0;border:3px solid var(--yellow)}
.hero-pics .p2{width:44%;height:52%;right:0;bottom:-20px;border:3px solid var(--red);transform:rotate(3deg)}
.sticker{position:absolute;top:24px;right:4%;z-index:3;background:var(--red);color:#fff;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:"Archivo Black";font-size:.82rem;line-height:1.15;text-transform:uppercase;transform:rotate(12deg);box-shadow:0 10px 30px rgba(224,38,43,.45);padding:12px}

/* bande défilante */
.ticker{background:var(--yellow);color:#1a1108;overflow:hidden;white-space:nowrap;padding:14px 0;transform:rotate(-1.2deg);margin:10px -10px 0}
.ticker div{display:inline-flex;gap:38px;animation:slide 30s linear infinite;font-family:"Archivo Black";text-transform:uppercase;font-size:1.05rem}
.ticker i{font-style:normal;color:var(--wine)}
@keyframes slide{to{transform:translateX(-50%)}}

section{padding:96px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.head h2{font-size:clamp(2rem,5vw,3.2rem);margin-top:10px}
.head h2 .marker{color:var(--yellow);font-weight:400;text-transform:none}
.head p{color:var(--muted);max-width:420px}

/* best-sellers */
.best{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.bs{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;overflow:hidden;transition:transform .25s,border-color .25s}
.bs:hover{transform:translateY(-4px);border-color:var(--yellow)}
.bs .tagline{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--red);color:#fff;padding:4px 10px;border-radius:6px;transform:rotate(-3deg)}
.bs h3{font-size:1.5rem;margin:16px 0 6px}
.bs p{color:var(--muted);font-size:.92rem}
.bs .cat{position:absolute;right:-6px;bottom:-14px;font-family:"Permanent Marker";font-size:4.2rem;color:rgba(245,166,35,.07);line-height:1}

/* carte */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--muted);font:600 .9rem Inter;padding:10px 18px;border-radius:999px;cursor:pointer;transition:.2s}
.tabs button:hover{color:var(--cream)}
.tabs button.on{background:var(--yellow);color:#1a1108;border-color:var(--yellow)}
.carte{display:grid;grid-template-columns:1fr 380px;gap:36px;align-items:start}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.item.full{grid-column:1/-1}
.item b{font-family:"Archivo Black";font-weight:400;text-transform:uppercase;font-size:1rem;letter-spacing:.02em}
.item small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.badge.r{background:var(--red);color:#fff}
.badge.y{background:rgba(245,166,35,.15);color:var(--yellow)}
.carte-side{position:sticky;top:90px}
.screen{border-radius:18px;overflow:hidden;border:3px solid var(--yellow);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.screen{background:#000}
.screen img{width:100%;height:auto}
.duo{margin-top:16px;background:var(--yellow);color:#1a1108;border-radius:18px;padding:22px}
.duo .h{font-size:1.6rem}
.duo p{font-size:.9rem;margin-top:6px;font-weight:500}
.note{color:var(--muted);font-size:.82rem;margin-top:18px}

/* ambiance */
.amb{background:var(--bg-2);position:relative}
.gal{display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:280px auto;gap:14px}
.gal figure{position:relative;overflow:hidden;border-radius:18px;background:#000}
.gal figure:first-child{grid-row:span 2}
.gal figure.wide{grid-column:span 2;aspect-ratio:1196/669}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.gal figure:hover img{transform:scale(1.05)}
.gal figcaption{position:absolute;left:14px;bottom:14px;background:rgba(13,10,8,.75);backdrop-filter:blur(6px);font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:999px}

/* kids */
.kids{display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:center}
.kids-img{border-radius:24px;overflow:hidden;border:3px solid #7b5cff;box-shadow:0 0 0 10px rgba(123,92,255,.12)}
.kids-img img{width:100%;aspect-ratio:4/5;object-fit:cover}
.kids h2{font-size:clamp(2rem,5vw,3.2rem);margin:10px 0 16px}
.kids h2 span{color:#ff5fa8}
.kids p{color:var(--muted);margin-bottom:22px}
.points{list-style:none;display:grid;gap:12px;margin-bottom:28px}
.points li{display:flex;gap:12px;align-items:center}
.points svg{color:var(--yellow)}

/* infos */
.infos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.box .ic{width:46px;height:46px;border-radius:12px;background:rgba(245,166,35,.12);color:var(--yellow);display:grid;place-items:center;margin-bottom:16px}
.box h3{font-size:1.15rem;margin-bottom:12px}
.box p,.box li{color:var(--muted);font-size:.93rem}
.hours{list-style:none}
.hours li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.hours li:last-child{border:0}
.hours li.today{color:var(--yellow);font-weight:600}
.open{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;margin-bottom:12px}
.open i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84}
.box .btn{margin-top:18px}

/* final */
.cta{text-align:center;padding:100px 0;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,rgba(224,38,43,.22),transparent 60%)}
.cta .marker{font-size:clamp(3rem,10vw,6rem);color:var(--red);text-shadow:0 0 8px #ff4b4b,0 0 30px rgba(224,38,43,.8),0 0 70px rgba(224,38,43,.5);line-height:1}
.cta p{color:var(--muted);margin:16px auto 28px;max-width:440px}

footer{border-top:1px solid var(--line);padding:34px 0 110px;font-size:.84rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.foot .logo b{font-size:1.5rem}
.soc{display:flex;gap:10px}
.soc a{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.soc a:hover{border-color:var(--yellow);color:var(--yellow)}
.made{margin-top:18px;font-size:.76rem;opacity:.7}

.steps{list-style:none;display:grid;gap:10px;margin:18px 0}
.steps li{display:flex;gap:12px;align-items:center;font-size:.92rem;color:var(--cream)}
.steps b{width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#1a1108;display:grid;place-items:center;font-size:.8rem;flex:none}
.tel-big{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--yellow);color:#1a1108;text-decoration:none;font-family:"Archivo Black";font-size:1.35rem;padding:14px;border-radius:14px;transition:background .2s}
.tel-big:hover{background:var(--yellow-2)}
.pickup{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.84rem!important;color:var(--yellow)!important;font-weight:600}
.or{display:flex;align-items:center;gap:12px;margin:12px 0;font-size:.78rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ta-big{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--yellow);color:var(--yellow);text-decoration:none;font-weight:700;padding:13px;border-radius:14px;transition:.2s}
.ta-big:hover{background:var(--yellow);color:#1a1108}
.hint{margin-top:12px;font-size:.84rem;color:var(--yellow);font-weight:600}

/* visionneuse photos */
.zoomable{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,4,3,.97);display:none;align-items:center;justify-content:center;padding:60px 70px;}
.lb.open{display:flex;animation:lbIn .25s ease}
@keyframes lbIn{from{opacity:0}}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb button{position:absolute;background:rgba(255,244,226,.1);border:1px solid rgba(255,244,226,.2);color:var(--cream);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.lb button:hover{background:var(--yellow);color:#1a1108}
.lb .x{top:16px;right:16px}
@media (max-width:600px){.lb{padding:70px 10px}}

/* avis */
.review{padding:70px 0 0}
.rv-card{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card),#2a1d12);border:1px solid var(--line);border-radius:26px;padding:48px 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.rv-card::after{content:"★";position:absolute;right:-30px;top:-70px;font-size:16rem;color:rgba(245,166,35,.05);line-height:1;pointer-events:none}
.rv-card h2{font-size:clamp(1.8rem,4.5vw,2.8rem);margin:10px 0 14px}
.rv-card p{color:var(--muted)}
.rv-side{text-align:center;position:relative;z-index:1}
.stars{display:inline-flex;gap:6px;margin-bottom:10px}
.stars a{color:var(--yellow);transition:color .15s,transform .15s;display:block}
.stars svg{width:44px;height:44px;fill:currentColor;stroke:none}
.stars a:hover ~ a{color:rgba(245,166,35,.3)}
.stars a:hover{transform:scale(1.15)}
.rv-hint{display:block;font-size:.82rem;color:var(--muted);margin-bottom:22px}
.g-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:.8rem;color:var(--muted)}

/* avis clients */
.tst{padding:90px 0 0}
.tst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;animation:pop .4s ease both}
.tc .st{display:flex;gap:3px;color:var(--yellow)}
.tc .st svg{width:18px;height:18px;fill:currentColor;stroke:none}
.tc blockquote{color:var(--cream);font-size:.96rem;line-height:1.65;flex:1}
.tc footer{display:flex;align-items:center;gap:12px;padding:0;border:0;font-size:.85rem;color:var(--muted)}
.tc .av{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:#1a1108;display:grid;place-items:center;font-weight:700;flex:none}
.tc b{display:block;color:var(--cream);font-weight:600}
.tst-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:26px}
.tst-nav button{display:none;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--cream);display:grid;place-items:center;cursor:pointer;transition:.2s}
.tst-nav button:hover{background:var(--yellow);color:#1a1108}
.tst-nav .pv svg{transform:scaleX(-1)}
.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dots i.on{background:var(--yellow);width:24px;border-radius:5px}
.src{text-align:center;font-size:.78rem;color:var(--muted);margin-top:14px}

/* barre mobile */
.mbar{display:none}

.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

@media (max-width:960px){
  .links{display:none}
  .links.show{display:flex;flex-direction:column;position:absolute;top:66px;left:0;right:0;background:var(--bg);padding:20px 16px;border-bottom:1px solid var(--line);gap:16px}
  .menu-btn{display:grid;place-items:center}
  .right .btn{display:none}
  .hero{padding:40px 0 60px}
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .hero-pics{height:440px}
  .best{grid-template-columns:1fr 1fr}
  .carte{grid-template-columns:1fr}
  .carte-side{position:static;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .duo{margin:0}
  .gal{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .gal figure{aspect-ratio:3/4}
  .gal figure:first-child{grid-row:auto;grid-column:span 2;aspect-ratio:4/3}
  .kids{grid-template-columns:1fr;gap:36px}
  .infos{grid-template-columns:1fr}
  .tst-grid{grid-template-columns:1fr}
  .rv-card{grid-template-columns:1fr;padding:34px 22px;text-align:center}
  .mbar{display:grid;grid-template-columns:.8fr .9fr 1.9fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(13,10,8,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:.72rem;font-weight:600;padding:8px;border-radius:12px;background:var(--card)}
  .mbar a.go{background:var(--yellow);color:#1a1108;flex-direction:row;justify-content:center;font-size:.9rem}
}
@media (max-width:600px){
  section{padding:70px 0}
  .ticker{padding:9px 0;margin-top:4px}
  .ticker div{font-size:.72rem;gap:16px;animation-duration:14s}
  .best,.list{grid-template-columns:1fr}
  .hero-pics{height:380px}
  .sticker{width:96px;height:96px;font-size:.7rem}
  .carte-side{grid-template-columns:1fr}
  .logo span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- Icônes au trait -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></symbol>

  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></symbol>
  <symbol id="i-fb" viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></symbol>

<div class="demo" data-t="demo"></div>

<header>

let tstPage = 0;
function renderReviews(){
  const sec = document.getElementById('reviews');
  sec.hidden = REVIEWS.length === 0;
  if (!REVIEWS.length) return;
  const pages = Math.ceil(REVIEWS.length / 3);
  tstPage = (tstPage + pages) % pages;
  const star = '<svg><use href="#i-star"/></svg>';
  document.getElementById('tstGrid').innerHTML = REVIEWS.slice(tstPage * 3, tstPage * 3 + 3).map((r, i) => `
    <article class="tc" style="animation-delay:${i * 80}ms">
      <div class="st">${star.repeat(r.note)}</div>
      <blockquote>« ${r.texte[lang]} »</blockquote>
      <footer><span class="av">${r.nom.charAt(0)}</span><span><b>${r.nom}</b>${r.quand[lang]} · Google${lang !== r.orig ? ' · ' + T[lang].t_trad : ''}</span></footer>
    </article>`).join('');
  document.getElementById('tstNav').style.display = pages > 1 ? '' : 'none';
  document.getElementById('tstDots').innerHTML = Array.from({length: pages}, (_, i) =>
    `<i class="${i === tstPage ? 'on' : ''}" data-p="${i}"></i>`).join('');
}
/* Défilement automatique toutes les 5 s (pause au survol) */
let tstTimer = null, tstHover = false;
function tstAuto(){
  clearInterval(tstTimer);
  if (REVIEWS.length > 3) tstTimer = setInterval(() => { if (!tstHover && !document.hidden) { tstPage++; renderReviews(); } }, 5000);
}
const tstGrid = document.getElementById('tstGrid');
tstGrid.addEventListener('mouseenter', () => tstHover = true);
tstGrid.addEventListener('mouseleave', () => tstHover = false);
document.getElementById('tstDots').onclick = e => { if (e.target.dataset.p) { tstPage = +e.target.dataset.p; renderReviews(); tstAuto(); } };
tstAuto();
/* Lien d'avis Google (ouvre directement « Écrire un avis » sur la fiche Abdijstraat 196) */
const REVIEW_URL = 'https://search.google.com/local/writereview?placeid=ChIJD6f5flb3w0cROM55awdE1Jo';
document.querySelectorAll('[data-review]').forEach(a => { a.href = REVIEW_URL; a.target = '_blank'; a.rel = 'noopener'; });
document.querySelectorAll('[data-tel]').forEach(a => a.href = 'tel:' + TEL);
/* Commande en ligne Takeaway (à emporter) */
const TAKEAWAY_URL = 'https://www.takeaway.com/be/menu/burgers-fried-chicken-antwerpen-antwerpen-1?serviceType=collection';
document.querySelectorAll('[data-takeaway]').forEach(a => { a.href = TAKEAWAY_URL; a.target = '_blank'; a.rel = 'noopener'; });
document.querySelectorAll('.tel-num').forEach(e => e.textContent = TEL_AFF);
let lang = 'nl', cat = 'chicken';
try { lang = localStorage.getItem('bfc-lang') || 'nl'; } catch(e){}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { if (typeof t[el.dataset.t] === 'string') el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));

  const tk = t.tk.map(x => `<span>${x}</span><i>★</i>`).join('');
  document.getElementById('tk').innerHTML = tk + tk;

  document.getElementById('bestList').innerHTML = BEST.map(b => `
    <article class="bs rv in">
      <span class="tagline">${t.bs}</span>
      <h3 class="h">${b.n}</h3>
      <p>${t.cats[b.c]} — ${t.bdesc[b.c]}</p>
      <div class="cat">BFC</div>
    </article>`).join('');

  document.getElementById('tabs').innerHTML = CARTE.map(c =>
    `<button data-c="${c.id}" class="${c.id === cat ? 'on' : ''}">${c[lang]}</button>`).join('');
  const c = CARTE.find(x => x.id === cat);
  document.getElementById('list').innerHTML = c.items.map((it, i) => `
    <div class="item${it.kid ? ' full' : ''}" style="animation-delay:${i * 40}ms">
      <div><b>${it.n}</b><small>${it.d ? it.d[lang] : c[lang]}</small></div>
      ${it.bs ? `<span class="badge r">${t.bs}</span>` : it.hot ? `<span class="badge y">${t.hot}</span>` : it.kid ? `<span class="badge r">${t.kid}</span>` : ''}
    </div>`).join('');
  const scr = document.getElementById('screenImg');
  scr.parentNode.style.display = c.img ? '' : 'none';
  if (c.img) scr.src = c.img;

  const today = (new Date().getDay() + 6) % 7;
  document.getElementById('hours').innerHTML = t.days.map((d, i) =>
    `<li class="${i === today ? 'today' : ''}"><span>${d}</span><span>${HOURS[i]}</span></li>`).join('');
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem('bfc-lang', lang); } catch(e){}
  render(); renderReviews();
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cat = b.dataset.c; render();
});
const links = document.getElementById('links');
document.getElementById('mb').onclick = () => links.classList.toggle('show');
links.addEventListener('click', e => { if (e.target.tagName === 'A') links.classList.remove('show'); });

render(); renderReviews();

/* ---------- Visionneuse : toucher une photo pour l'agrandir ---------- */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
const SEL = '.hero-pics img, .screen img, .gal img, .kids-img img';
function lbOpen(img){
  lbImg.src = img.src; lbImg.alt = img.alt;
  lb.classList.add('open'); lb.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function lbClose(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow = ''; }
document.addEventListener('click', e => {
  const f = e.target.closest('.hero-pics figure, .screen, .gal figure, .kids-img');
  if (f && !lb.contains(e.target)) lbOpen(f.querySelector('img'));
});
document.querySelectorAll(SEL).forEach(el => el.classList.add('zoomable'));
document.getElementById('lbX').onclick = lbClose;
lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) lbClose(); });

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));
</script>
