<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Gonza'z</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1633;--night-2:#12224a;--gold:#d9a84e;--cream:#f7f1e3;--card:#fff;--line:#e6dcc6;--red:#c8312b;--neon:#ff7b2e;--ink:#1a2240;--muted:#6b6f80;--ok:#1f8a4c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
.logo{font-family:"Righteous",cursive;color:var(--neon);font-size:1.6rem;text-shadow:0 0 10px rgba(255,123,46,.5)}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 30%,var(--night-2),var(--night))}
.login-box{background:var(--card);border-radius:20px;padding:34px 28px;width:100%;max-width:380px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-box .logo{font-size:2.4rem;display:block;margin-bottom:4px}
.login-box p{color:var(--muted);font-size:.9rem;margin-bottom:22px}
.login-box input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;text-align:center}
.hint{background:#fff6e0;border:1px dashed var(--gold);border-radius:10px;padding:8px;font-size:.82rem;margin-top:14px}
.err{color:var(--red);font-size:.85rem;min-height:1.2em;margin-bottom:6px}

/* Layout */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:240px 1fr}
aside{background:var(--night);color:#e9e3d2;padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .logo{padding:0 10px 4px}
aside small{color:#9aa3c0;padding:0 10px 18px;font-size:.78rem}
.nav-btn{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;color:#d6d0bf;font-weight:500}
.nav-btn:hover{background:rgba(255,255,255,.06)}
.nav-btn.on{background:var(--gold);color:var(--night)}
.nav-btn span{font-size:1.15rem;width:22px;text-align:center}
aside .bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.link{color:#9aa3c0;font-size:.82rem;background:none;border:0;cursor:pointer;text-align:left;padding:6px 12px;text-decoration:underline}
main{padding:30px 34px 120px;max-width:980px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:1.6rem}
.sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.92rem}
.btn.primary{background:var(--night);color:#fff}
.btn.gold{background:var(--gold);color:var(--night)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:#fde8e6;color:var(--red)}
.btn.sm{padding:7px 11px;font-size:.82rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.card h2{font-size:1.1rem;margin-bottom:4px}
.card .sub{margin-bottom:14px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=url],input[type=time],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fffdf8}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,168,78,.2)}
textarea{min-height:80px;resize:vertical}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(11,22,51,.08)}
.tile b{display:block;font-size:1.8rem;margin:6px 0 2px}
.tile span{font-size:1.4rem}
.tile small{color:var(--muted)}

/* Carte */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.chip.on{background:var(--night);color:#fff;border-color:var(--night)}
.chip.add{border-style:dashed;color:var(--muted)}
.langbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px;font-size:.85rem;font-weight:600;color:var(--muted)}
.langbar .chip{padding:6px 12px;font-size:.8rem}
.cat-head{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:start}
.thumb{width:130px;aspect-ratio:4/5;border-radius:12px;object-fit:cover;background:#eee;display:block}
.row{display:grid;grid-template-columns:1.3fr .5fr 2fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.tools{display:flex;gap:4px}
.ico{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;font-size:.9rem}
.ico:hover{border-color:var(--gold)}
.ico.del:hover{border-color:var(--red);background:#fde8e6}
.colhead{display:grid;grid-template-columns:1.3fr .5fr 2fr auto;gap:8px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.colhead span:last-child{width:110px}
.row.ev{grid-template-columns:1fr 2fr auto}

/* Horaires */
.day{display:grid;grid-template-columns:110px 120px 1fr 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.85rem;font-weight:600;margin:0;color:var(--ink)}
.switch input{appearance:none;width:42px;height:24px;background:#d9d3c4;border-radius:999px;position:relative;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:21px}
.day.closed input[type=time]{opacity:.35}

/* Galerie */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#eee}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .tools{position:absolute;bottom:6px;left:6px;right:6px;justify-content:center;gap:6px}
.ph .ico{width:30px;height:30px;background:rgba(255,255,255,.92)}
.ph .badge{position:absolute;top:6px;left:6px;background:var(--gold);color:var(--night);font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px}
.upload{border:2px dashed var(--line);border-radius:12px;aspect-ratio:1;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;font-size:.85rem;padding:10px}
.upload:hover{border-color:var(--gold);color:var(--ink)}
.file{display:none}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--night);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:.9rem;transition:transform .3s;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
.demo-note{background:#fff6e0;border:1px dashed var(--gold);border-radius:12px;padding:12px 16px;font-size:.85rem;margin-bottom:20px}

@media (max-width:860px){
  #app.on{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:40;justify-content:space-around;gap:0}
  aside .logo,aside small,aside .bottom{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:.66rem;padding:7px 4px;flex:1;text-align:center}
  main{padding:20px 16px 110px}
  .tiles{grid-template-columns:1fr 1fr}
  .cat-head{grid-template-columns:90px 1fr}
  .thumb{width:90px}
  .row{grid-template-columns:1fr 90px;grid-template-areas:"n p" "d d" "t t"}
  .row .f-n{grid-area:n}.row .f-p{grid-area:p}.row .f-d{grid-area:d}.row .tools{grid-area:t;justify-content:flex-end}
  .colhead{display:none}
  .day{grid-template-columns:1fr 1fr}
  .row.ev{grid-template-columns:1fr;grid-template-areas:"n" "d" "t"}
  .gal{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- Connexion -->
<section id="login">
  <form class="login-box" id="login-form">
    <span class="logo">Gonza'z</span>
    <p>Espace de gestion du site</p>
    <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn primary" style="width:100%;justify-content:center;padding:13px">Se connecter</button>
    <div class="hint">Démo : le mot de passe est <b>gonzaz</b></div>
  </form>
</section>

<!-- Application -->
<div id="app">
  <aside>
    <span class="logo">Gonza'z</span>
    <small>Panel admin</small>
    <button class="nav-btn" data-view="accueil"><span>🏠</span>Accueil</button>
    <button class="nav-btn" data-view="carte"><span>🍽️</span>La carte</button>
    <button class="nav-btn" data-view="horaires"><span>🕒</span>Horaires</button>
    <button class="nav-btn" data-view="events"><span>🎷</span>Événements</button>
    <button class="nav-btn" data-view="galerie"><span>📷</span>Photos</button>
    <button class="nav-btn" data-view="textes"><span>✏️</span>Textes & infos</button>
    <div class="bottom">
      <a class="btn gold" href="index.html" target="_blank">Voir le site ↗</a>
      <button class="link" data-act="reset">Réinitialiser la démo</button>
      <button class="link" data-act="logout">Se déconnecter</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<input type="file" accept="image/*" class="file" id="file-one">
<input type="file" accept="image/*" class="file" id="file-many" multiple>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id), esc = GZ_esc;
let D = GZ_load(), view = 'accueil', cat = 0, L = 'nl';
const LN = { nl: 'Nederlands', en: 'English', fr: 'Français' };
const t3 = () => ({ nl: '', en: '', fr: '' });
const val = v => (v && typeof v === 'object') ? (v[L] || '') : (v || '');
const hint = v => esc(GZ_tr(v, 'nl') || GZ_tr(v, 'fr'));

/* ---------- Connexion (démo) ---------- */
function enter(){ $('login').style.display = 'none'; $('app').classList.add('on'); render(); }
try { if (sessionStorage.getItem('gz_admin')) enter(); } catch(e){}
$('login-form').addEventListener('submit', e => {
  e.preventDefault();
  if ($('pwd').value.trim().toLowerCase() === 'gonzaz') {
    try { sessionStorage.setItem('gz_admin', '1'); } catch(err){}
    enter();
  } else $('err').textContent = 'Mot de passe incorrect';
});

/* ---------- Enregistrement ---------- */
let saveTimer;
function save(now){
  clearTimeout(saveTimer);
  const doSave = () => {
    try { GZ_save(D); toast('Enregistré ✓ — visible sur le site'); }
    catch(e){ toast("Espace de la démo plein : supprimez une photo ajoutée", true); }
  };
  now ? doSave() : (saveTimer = setTimeout(doSave, 500));
}
let toastTimer;
function toast(msg, bad){
  const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 2200);
}

/* Liaison automatique des champs : data-bind="carte.0.plats.1.p" */
function setPath(path, val){
  const k = path.split('.'); let o = D;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}
document.addEventListener('input', e => {
  const b = e.target.dataset.bind; if (!b) return;
  setPath(b, e.target.type === 'checkbox' ? e.target.checked : e.target.value);
  if (e.target.type === 'checkbox') { e.target.closest('.day')?.classList.toggle('closed', !e.target.checked); save(true); }
  else save();
  if (e.target.dataset.live) render(); // ex : nom de catégorie
});

/* ---------- Photos : redimensionnées dans le navigateur ---------- */
function readImage(file){
  return new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', .72));
      };
      img.onerror = ko; img.src = r.result;
    };
    r.onerror = ko; r.readAsDataURL(file);
  });
}
let pickTarget = null;
function pickOne(cb){ pickTarget = cb; $('file-one').value = ''; $('file-one').click(); }
$('file-one').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f || !pickTarget) return;
  try { pickTarget(await readImage(f)); save(true); render(); } catch(err){ toast('Image illisible', true); }
});
$('file-many').addEventListener('change', async e => {
  for (const f of e.target.files) { try { D.galerie.push(await readImage(f)); } catch(err){} }
  save(true); render();
});

/* ---------- Actions (boutons) ---------- */
function move(arr, i, d){ const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
document.addEventListener('click', e => {
  const nb = e.target.closest('[data-view]');
  if (nb) { view = nb.dataset.view; render(); window.scrollTo(0,0); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const i = +a.dataset.i, P = D.carte[cat]?.plats;
  switch (a.dataset.act) {
    case 'lang': L = a.dataset.l; render(); return;
    case 'cat': cat = i; break;
    case 'cat-add': D.carte.push({ nom: { nl: 'Nieuwe categorie', en: 'New category', fr: 'Nouvelle catégorie' }, photo: '', plats: [] }); cat = D.carte.length - 1; break;
    case 'cat-del': if (!confirm('Supprimer la catégorie « ' + GZ_tr(D.carte[cat].nom, 'fr') + ' » et tous ses plats ?')) return;
      D.carte.splice(cat, 1); cat = 0; break;
    case 'cat-left': move(D.carte, cat, -1); cat = Math.max(0, cat - 1); break;
    case 'cat-right': if (cat < D.carte.length - 1) { move(D.carte, cat, 1); cat++; } break;
    case 'cat-photo': pickOne(src => D.carte[cat].photo = src); return;
    case 'plat-add': P.push({ n: t3(), p: '', d: t3() }); save(true); render();
      setTimeout(() => { const ins = document.querySelectorAll('.row .f-n'); ins[ins.length - 1]?.focus(); }); return;
    case 'plat-up': move(P, i, -1); break;
    case 'plat-down': move(P, i, 1); break;
    case 'plat-del': P.splice(i, 1); break;
    case 'ev-add': D.events.push({ n: '', d: t3() }); break;
    case 'ev-up': move(D.events, i, -1); break;
    case 'ev-down': move(D.events, i, 1); break;
    case 'ev-del': D.events.splice(i, 1); break;
    case 'affiche': pickOne(src => D.affiche = src); return;
    case 'ph-add': $('file-many').value = ''; $('file-many').click(); return;
    case 'ph-left': move(D.galerie, i, -1); break;
    case 'ph-right': move(D.galerie, i, 1); break;
    case 'ph-del': D.galerie.splice(i, 1); break;
    case 'reset': if (!confirm('Remettre tout le contenu de la démo à zéro ?')) return;
      GZ_reset(); D = GZ_load(); cat = 0; render(); toast('Démo réinitialisée'); return;
    case 'logout': try { sessionStorage.removeItem('gz_admin'); } catch(err){} location.reload(); return;
    default: return;
  }
  save(true); render();
});

/* ---------- Vues ---------- */
const head = (t, s) => `<div class="top"><div><h1>${t}</h1><p class="sub">${s}</p></div><a class="btn primary" href="index.html" target="_blank">Voir le site ↗</a></div>`;

const langBar = () => `<div class="langbar"><span>Langue du contenu :</span>${GZ_LANGS.map(l =>
  `<button class="chip${l === L ? ' on' : ''}" data-act="lang" data-l="${l}">${l.toUpperCase()} · ${LN[l]}</button>`).join('')}</div>`;

const V = {
  accueil: () => {
    const nPlats = D.carte.reduce((s, c) => s + c.plats.length, 0);
    const ouverts = D.horaires.filter(h => h.ouvert).length;
    return head('Bonjour Gonza\'z 👋', 'Tout ce que vous modifiez ici apparaît directement sur votre site.') + `
    <div class="demo-note">💡 <b>Version démo :</b> les changements sont enregistrés dans ce navigateur uniquement. Dans la vraie version, ils sont en ligne pour tout le monde.</div>
    <div class="tiles">
      <button class="tile" data-view="carte"><span>🍽️</span><b>${nPlats}</b><small>plats & boissons</small></button>
      <button class="tile" data-view="horaires"><span>🕒</span><b>${ouverts}/7</b><small>jours ouverts</small></button>
      <button class="tile" data-view="events"><span>🎷</span><b>${D.events.length}</b><small>événements</small></button>
      <button class="tile" data-view="galerie"><span>📷</span><b>${D.galerie.length}</b><small>photos</small></button>
    </div>
    <div class="card">
      <h2>📢 Bandeau d'annonce</h2>
      <p class="sub">S'affiche en rouge tout en haut du site. Laissez vide pour le cacher.</p>
      ${langBar()}
      <input type="text" data-bind="annonce.${L}" value="${esc(val(D.annonce))}" placeholder="Ex : Fermé exceptionnellement le 24 décembre · Concert live ce vendredi !">
    </div>`;
  },

  carte: () => {
    if (cat >= D.carte.length) cat = 0;
    const c = D.carte[cat];
    let html = head('La carte', 'Ajoutez, modifiez ou supprimez vos plats et vos prix.') + langBar() + `
    <div class="chips">${D.carte.map((x, i) => `<button class="chip${i === cat ? ' on' : ''}" data-act="cat" data-i="${i}">${esc(GZ_tr(x.nom, L)) || '(sans nom)'}</button>`).join('')}
      <button class="chip add" data-act="cat-add">+ Catégorie</button></div>`;
    if (!c) return html + '<div class="card">Aucune catégorie. Ajoutez-en une.</div>';
    html += `<div class="card">
      <div class="cat-head">
        <div>${c.photo ? `<img class="thumb" src="${esc(c.photo)}" alt="">` : '<div class="thumb"></div>'}
          <button class="btn ghost sm" style="margin-top:8px;width:100%;justify-content:center" data-act="cat-photo">Changer la photo</button></div>
        <div>
          <label>Nom de la catégorie (${LN[L]})</label>
          <input type="text" data-bind="carte.${cat}.nom.${L}" value="${esc(val(c.nom))}" placeholder="${hint(c.nom)}">
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="btn ghost sm" data-act="cat-left">← Déplacer</button>
            <button class="btn ghost sm" data-act="cat-right">Déplacer →</button>
            <button class="btn danger sm" data-act="cat-del">Supprimer la catégorie</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>${esc(GZ_tr(c.nom, L))} — ${c.plats.length} élément(s)</h2>
      <p class="sub">Vous modifiez la version <b>${LN[L]}</b>. Le prix est le même dans toutes les langues.</p>
      <div class="colhead"><span>Nom</span><span>Prix (€)</span><span>Description</span><span></span></div>
      ${c.plats.map((p, i) => `<div class="row">
        <input class="f-n" type="text" placeholder="${hint(p.n) || 'Nom du plat'}" data-bind="carte.${cat}.plats.${i}.n.${L}" value="${esc(val(p.n))}">
        <input class="f-p" type="text" placeholder="0,00" data-bind="carte.${cat}.plats.${i}.p" value="${esc(p.p)}">
        <input class="f-d" type="text" placeholder="${hint(p.d) || 'Description'}" data-bind="carte.${cat}.plats.${i}.d.${L}" value="${esc(val(p.d))}">
        <div class="tools">
          <button class="ico" title="Monter" data-act="plat-up" data-i="${i}">↑</button>
          <button class="ico" title="Descendre" data-act="plat-down" data-i="${i}">↓</button>
          <button class="ico del" title="Supprimer" data-act="plat-del" data-i="${i}">🗑</button>
        </div></div>`).join('')}
      <button class="btn primary" style="margin-top:16px" data-act="plat-add">+ Ajouter un plat</button>
    </div>`;
    return html;
  },

  horaires: () => head('Horaires', "Activez ou désactivez un jour, changez les heures d'ouverture.") + `
    <div class="card">${D.horaires.map((h, i) => `<div class="day${h.ouvert ? '' : ' closed'}">
      <b class="j">${GZ_DAYS.fr[i]}</b>
      <label class="switch"><input type="checkbox" data-bind="horaires.${i}.ouvert" ${h.ouvert ? 'checked' : ''}> Ouvert</label>
      <input type="time" data-bind="horaires.${i}.de" value="${esc(h.de)}" aria-label="Ouverture">
      <input type="time" data-bind="horaires.${i}.a" value="${esc(h.a)}" aria-label="Fermeture">
    </div>`).join('')}</div>`,

  events: () => head('Événements', 'Mettez à jour votre affiche et la liste des concerts.') + `
    <div class="card"><div class="cat-head">
      <img class="thumb" src="${esc(D.affiche)}" alt="">
      <div><h2>Affiche du mois</h2><p class="sub">Grande image affichée dans la section « Live music ».</p>
        <button class="btn primary sm" data-act="affiche">Téléverser une nouvelle affiche</button></div>
    </div></div>
    <div class="card"><h2>Artistes & soirées</h2><p class="sub">Affichés à côté de l'affiche, dans cet ordre. La description se traduit, le nom reste le même.</p>${langBar()}
      ${D.events.map((ev, i) => `<div class="row ev">
        <input class="f-n" type="text" placeholder="Nom de l'artiste / soirée" data-bind="events.${i}.n" value="${esc(ev.n)}">
        <input class="f-d" type="text" placeholder="${hint(ev.d) || 'Description (date, style…)'}" data-bind="events.${i}.d.${L}" value="${esc(val(ev.d))}">
        <div class="tools">
          <button class="ico" data-act="ev-up" data-i="${i}">↑</button>
          <button class="ico" data-act="ev-down" data-i="${i}">↓</button>
          <button class="ico del" data-act="ev-del" data-i="${i}">🗑</button>
        </div></div>`).join('')}
      <button class="btn primary" style="margin-top:16px" data-act="ev-add">+ Ajouter un événement</button>
    </div>`,

  galerie: () => head('Photos', 'La première photo est affichée en grand dans la galerie.') + `
    <div class="card"><div class="gal">
      ${D.galerie.map((src, i) => `<div class="ph"><img src="${esc(src)}" alt="">${i === 0 ? '<span class="badge">En grand</span>' : ''}
        <div class="tools">
          <button class="ico" data-act="ph-left" data-i="${i}">←</button>
          <button class="ico" data-act="ph-right" data-i="${i}">→</button>
          <button class="ico del" data-act="ph-del" data-i="${i}">🗑</button>
        </div></div>`).join('')}
      <button class="upload" data-act="ph-add">📷<br>Ajouter des photos</button>
    </div></div>`,

  textes: () => head('Textes & infos', 'Modifiez les textes de votre site et vos coordonnées.') + langBar() + `
    <div class="card"><h2>Page d'accueil</h2>
      <label>Phrase d'accroche</label><textarea data-bind="slogan.${L}" placeholder="${hint(D.slogan)}">${esc(val(D.slogan))}</textarea></div>
    <div class="card"><h2>Notre histoire</h2>
      <label>Paragraphe 1</label><textarea data-bind="histoire1.${L}" placeholder="${hint(D.histoire1)}">${esc(val(D.histoire1))}</textarea>
      <label>Paragraphe 2</label><textarea data-bind="histoire2.${L}" placeholder="${hint(D.histoire2)}">${esc(val(D.histoire2))}</textarea>
      <label>Citation</label><input type="text" data-bind="citation.${L}" value="${esc(val(D.citation))}" placeholder="${hint(D.citation)}"></div>
    <div class="card"><h2>Coordonnées <small style="font-weight:400;color:var(--muted)">(identiques dans toutes les langues)</small></h2>
      <label>Adresse</label><textarea data-bind="adresse" style="min-height:60px">${esc(D.adresse)}</textarea>
      <label>Lien Instagram</label><input type="url" data-bind="instagram" value="${esc(D.instagram)}"></div>`
};

function render(){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('view').innerHTML = V[view]();
}
</script>
</body>
</html>
